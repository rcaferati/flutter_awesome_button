name: Package CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Flutter package quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter 3.41.7
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Verify pinned toolchain
        shell: bash
        run: |
          flutter --version
          flutter --version --machine | jq -e \
            '.frameworkVersion == "3.41.7" and .dartSdkVersion == "3.11.5"'

      - name: Run package release preflight
        run: tool/release-preflight.sh

      - name: Upload informational Flutter coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-awesome-button-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  portability:
    name: Package host test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter 3.41.7
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Resolve package dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run package-owned host tests
        run: flutter test
