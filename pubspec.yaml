name: flutter_awesome_button
description: Layered 3D animated buttons for Flutter with progress flows, theming, and built-in theme variants.
version: 0.9.0
homepage: https://github.com/rcaferati/flutter_awesome_button
repository: https://github.com/rcaferati/flutter_awesome_button
issue_tracker: https://github.com/rcaferati/flutter_awesome_button/issues

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

platforms:
  android:
  ios:
  web:
  macos:
  linux:
  windows:

topics:
  - flutter
  - buttons
  - animation
  - theming
  - progress

screenshots:
  - description: Blue themed Awesome Button states with the layered shell treatment.
    path: screenshots/demo-button-blue-new.gif
  - description: Cartman-themed layered button variants shown in the Flutter example app.
    path: screenshots/demo-button-cartman.gif
  - description: Rick-themed layered button variants shown in the Flutter example app.
    path: screenshots/demo-button-rick.gif

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
